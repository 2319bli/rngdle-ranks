<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RNGdle Rank Explorer</title>
<link rel="stylesheet" href="./assets/styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><meta name="description" content="Explore RNGdle numbers by score and exact rank."><link rel="icon" href="./favicon.svg" type="image/svg+xml"></head><body><div class="flex h-[100dvh] flex-col bg-site-bg font-sans overflow-hidden"><header class="bg-site-bg text-prose"><div class="flex w-full items-center justify-between py-1 pe-2 ps-6 sm:ps-4"><div class="flex items-center gap-3"><span class="text-lg font-bold tracking-widest normal-case">RNGdle</span><span class="type-meta text-prose-3">Rank Explorer</span></div><button type="button" id="theme" class="theme-button rounded-lg hover:bg-surface-raised" aria-label="Switch to light theme">☀ Light</button></div></header><main class="flex-1 overflow-y-auto overflow-x-hidden p-2 sm:p-8"><div class="max-w-2xl mx-auto px-4 py-4">
<section class="lookup"><label for="number" id="input-label">Choose a whole number from 0 to 1,000,000</label><form id="form" class="lookup-controls" novalidate><select id="mode" aria-label="Search by"><option value="number">Number</option><option value="ep">EP</option><option value="rank">Rank</option></select><input id="number" type="text" inputmode="numeric" value="4" aria-describedby="error" autocomplete="off"><button type="submit" class="type-button border border-outline rounded-lg text-prose-2 bg-surface hover:bg-surface-raised">Find</button></form><div class="examples">Try <button type="button" data-number="1">1</button><button type="button" data-number="4">4</button><button type="button" data-number="67">67</button><button type="button" data-number="243754">243754</button><button type="button" id="random">Random</button></div><p class="error" id="error" role="alert"></p></section>
<section id="matches" hidden aria-live="polite"><h2 id="matches-title" class="matches-heading"></h2><p id="matches-note" class="matches-note"></p><div id="match-list" class="match-list"></div><div class="pager"><button id="previous" type="button">Previous</button><span id="page-label"></span><button id="next" type="button">Next</button></div></section>
<section id="result" aria-live="polite"><div class="flex justify-center mb-4"><div id="hero" class="relative overflow-hidden inline-flex items-center justify-center rounded-xl px-8 py-5 border-3 bg-gradient-to-br"><div class="number-shine absolute -inset-px pointer-events-none rounded-xl dark:opacity-40"></div><div id="number-label" class="relative z-10 font-roll font-bold tabular-nums"></div></div></div>
<div class="flex items-center justify-center gap-3 mb-4"><span id="tier"></span><span class="text-outline-strong">•</span><span id="percentile" class="type-ui font-medium"></span></div>
<div class="flex flex-col items-center mb-4"><div id="ep-pill" class="type-data inline-flex items-center font-semibold px-3 py-1 rounded-full"><span id="score"></span>&nbsp;EP</div><div class="summary-rank"><span id="rank"></span> / 1,000,001</div><p id="tie" class="type-meta text-prose-3 text-center"></p><div class="summary-counts"><span><span id="above"></span> ahead</span><span><span id="below"></span> below</span></div></div>
<div class="text-center pt-2 mb-2"><h2 class="type-section-title text-xl leading-7 text-prose">Badge Breakdown</h2><div id="badge-count" class="type-meta text-prose-3"></div></div><div id="badges" class="space-y-3"></div><details id="other"><summary id="other-label"></summary><div id="other-badges" class="space-y-3"></div></details></section>
<footer class="explorer-footer">Independent rank calculator · RNGdle scoring snapshot, 5 October 2026.<br>Rank = 1 + the number of higher-scoring numbers. Ties share a rank; searching an occupied position returns its tied group.</footer></div></main></div><script defer src="./assets/scoring-engine.js"></script><script defer src="./assets/app.js"></script></body></html>
